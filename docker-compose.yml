version: "2"

volumes:
  birdnet-config:
  birdnet-data:

services:
  birdnet-go:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BIRDNET_GO_VERSION=sha256:233b94f1d3b27b261ec8d997364db0cb953f3e3b3362a89e9e22ad4a589143d6
    # image: ghcr.io/tphakala/birdnet-go:latest   # alternative: pull upstream directly
    restart: always
    privileged: true
    ports:
      - "8080:8080"
    volumes:
      - "birdnet-config:/config"
      - "birdnet-data:/data"
    devices:
      - "/dev/snd:/dev/snd"
    environment:
      - TZ=Europe/Amsterdam
    labels:
      io.balena.features.balena-api: "1"
      io.balena.features.kernel-modules: "1"
      io.balena.features.supervisor-api: "1"
