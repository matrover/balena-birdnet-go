version: "2"

volumes:
  birdnet-config:
  birdnet-data:

services:
  birdnet-go:
    image: ghcr.io/tphakala/birdnet-go:latest
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - "birdnet-config:/config"
      - "birdnet-data:/data"
    environment:
      - TZ=Europe/Amsterdam
    labels:
      io.balena.features.balena-api: "1"
      io.balena.features.kernel-modules: "1"
